<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Clase</title>
    <style>
        /* Estilos generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
        }

        /* Barra de navegación */
        nav {
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #1abc9c;
        }

        /* Contenido principal */
        main {
            padding: 3rem 2rem;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav>
        <div class="logo">MiProyecto</div>
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Acerca de</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <!-- Contenido Principal -->
    <main>
        <h1>Bienvenido a mi Trabajo de Clase</h1>
        <p>Esta es la estructura inicial del proyecto lista para desarrollar.</p>

<img src="https://www.bing.com/images/search?view=detailV2&ccid=%2fFyO%2f76m&id=F4E0B30564E35565732CBC430455E4476BE93D48&thid=OIP._FyO_76mY1GSBxILxqcmVQAAAA&mediaurl=https%3a%2f%2fimages.pokemoncard.io%2fimages%2fsm1%2fsm1-169.png&cdnurl=https%3a%2f%2fth.bing.com%2fth%2fid%2fR.fc5c8effbea663519207120bc6a72655%3frik%3dSD3pa0fkVQRDvA%26pid%3dImgRaw%26r%3d0&exph=330&expw=233&q=sfsdg&FORM=IRPRST&ck=857EE76DC758C22ABCAC27C82DB07C31&selectedIndex=6&itb=0" alt=""></div>

    </div>
    
    </main>



</body>
</html>
